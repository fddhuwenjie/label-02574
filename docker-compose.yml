services:
  chat-server:
    build:
      context: ./backend
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
        - linux/arm64
    container_name: chat-server
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=${DATABASE_TYPE:-sqlite}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/chat.db}
      - PORT=8000
      - TUNNEL_TYPE=${TUNNEL_TYPE:-none}
      - NGROK_AUTH_TOKEN=${NGROK_AUTH_TOKEN:-}
    volumes:
      - chat-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - chat-network

  # 可选：PostgreSQL数据库
